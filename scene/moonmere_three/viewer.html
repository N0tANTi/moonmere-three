<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>月沼白堡 · Three.js</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;background:#080b08;color:#f4f5ea;font:14px "Segoe UI","Microsoft YaHei",sans-serif}body{display:grid;grid-template-rows:minmax(0,1fr) auto}main{min-height:0;display:grid;place-items:center;overflow:hidden}canvas{display:block;max-height:100%;max-width:100%;width:min(100vw,calc((100dvh - 58px)*16/9));aspect-ratio:16/9;touch-action:none;cursor:grab}canvas:active{cursor:grabbing}.transport{height:58px;display:flex;gap:15px;align-items:center;justify-content:center;padding:8px 4vw;color:#ced3c4;background:#10130f}.transport[hidden]{display:none}button{font:inherit;color:#f3f3e9;border:1px solid #55604f;border-radius:4px;padding:5px 12px;background:#20261d;cursor:pointer}button:hover{background:#34402e}input{width:min(32vw,380px);min-width:50px;accent-color:#a8bd82}output{white-space:nowrap;font-variant-numeric:tabular-nums}.hint{color:#a4ac9d;font-size:12px}@media(max-width:580px){.hint{display:none}.transport{gap:9px;padding-inline:8px}}
body{grid-template-columns:minmax(0,1fr)}.has-grade{min-width:0}.has-grade button[aria-pressed]{white-space:nowrap}.has-grade button[aria-pressed]::before{content:'○ ';font-weight:700}.has-grade button[aria-pressed=true]{background:#394a30;border-color:#819479}.has-grade button[aria-pressed=true]::before{content:'● '}
@media(max-width:580px){.has-grade button{padding-inline:6px;white-space:nowrap}.has-grade input{width:22vw;min-width:26px;flex-shrink:1}}
</style></head><body><main><canvas aria-label="月沼白堡，拖动画面可暂停并转动视角" tabindex="0"></canvas></main>
<nav class="transport" aria-label="镜头播放"><button id="play">暂停</button><input id="seek" type="range" min="0" max="10" value="0" step=".01" aria-label="镜头时间"><output>0:00 / 0:10</output><button id="reset">重播</button><span class="hint">拖动画面可暂停并转动视角</span></nav>
<script>/*__MOONMERE__*/</script></body></html>
